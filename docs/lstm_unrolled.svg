<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d03b3b"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="14" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0b0b0b">The LSTM unrolled over one 14-day sample</text>

  <!-- BPTT arrow -->
  <line x1="880" y1="76" x2="90" y2="76" stroke="#d03b3b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="300" y="66" font-size="12" fill="#d03b3b">backward pass (BPTT): the error flows back day by day, through h and c</text>

  <!-- start state -->
  <text x="14" y="134" font-size="13" fill="#14845c">c₀ = 0</text>
  <text x="14" y="184" font-size="13" fill="#2a78d6">h₀ = 0</text>
  <line x1="58" y1="130" x2="78" y2="130" stroke="#1baf7a" stroke-width="3" marker-end="url(#a)"/>
  <line x1="58" y1="180" x2="78" y2="180" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>

  <!-- cells -->
  <g font-size="14" text-anchor="middle" fill="#0b0b0b">
    <rect x="80" y="104" width="110" height="100" rx="12" fill="#f3f2ee" stroke="#c3c2b7"/>
    <text x="135" y="150">LSTM cell</text><text x="135" y="170" font-size="12" fill="#52514e">day t−14</text>
    <rect x="250" y="104" width="110" height="100" rx="12" fill="#f3f2ee" stroke="#c3c2b7"/>
    <text x="305" y="150">LSTM cell</text><text x="305" y="170" font-size="12" fill="#52514e">day t−13</text>
    <text x="440" y="160" font-size="22" fill="#52514e">· · ·</text>
    <rect x="510" y="104" width="110" height="100" rx="12" fill="#f3f2ee" stroke="#c3c2b7"/>
    <text x="565" y="150">LSTM cell</text><text x="565" y="170" font-size="12" fill="#52514e">day t−2</text>
    <rect x="680" y="104" width="110" height="100" rx="12" fill="#f3f2ee" stroke="#c3c2b7"/>
    <text x="735" y="150">LSTM cell</text><text x="735" y="170" font-size="12" fill="#52514e">day t−1</text>
  </g>

  <!-- c and h between cells -->
  <g stroke-width="3">
    <line x1="190" y1="130" x2="248" y2="130" stroke="#1baf7a" marker-end="url(#a)"/>
    <line x1="190" y1="180" x2="248" y2="180" stroke="#2a78d6" marker-end="url(#a)"/>
    <line x1="360" y1="130" x2="405" y2="130" stroke="#1baf7a" marker-end="url(#a)"/>
    <line x1="360" y1="180" x2="405" y2="180" stroke="#2a78d6" marker-end="url(#a)"/>
    <line x1="470" y1="130" x2="508" y2="130" stroke="#1baf7a" marker-end="url(#a)"/>
    <line x1="470" y1="180" x2="508" y2="180" stroke="#2a78d6" marker-end="url(#a)"/>
    <line x1="620" y1="130" x2="678" y2="130" stroke="#1baf7a" marker-end="url(#a)"/>
    <line x1="620" y1="180" x2="678" y2="180" stroke="#2a78d6" marker-end="url(#a)"/>
  </g>
  <g font-size="12">
    <text x="205" y="122" fill="#14845c">c₁</text><text x="205" y="198" fill="#2a78d6">h₁</text>
    <text x="634" y="122" fill="#14845c">c₁₃</text><text x="634" y="198" fill="#2a78d6">h₁₃</text>
  </g>

  <!-- inputs -->
  <g stroke="#52514e" stroke-width="1.6">
    <line x1="135" y1="252" x2="135" y2="206" marker-end="url(#a)"/>
    <line x1="305" y1="252" x2="305" y2="206" marker-end="url(#a)"/>
    <line x1="565" y1="252" x2="565" y2="206" marker-end="url(#a)"/>
    <line x1="735" y1="252" x2="735" y2="206" marker-end="url(#a)"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#0b0b0b">
    <text x="135" y="272">x₁</text><text x="305" y="272">x₂</text><text x="565" y="272">x₁₃</text><text x="735" y="272">x₁₄</text>
  </g>
  <text x="440" y="296" font-size="12" text-anchor="middle" fill="#52514e">each xₖ = one day's features [temp_min, doy_sin, doy_cos], scaled  (3 numbers; 9 with weather)</text>

  <!-- output -->
  <line x1="790" y1="180" x2="818" y2="180" stroke="#2a78d6" stroke-width="3" marker-end="url(#a)"/>
  <text x="796" y="198" font-size="12" fill="#2a78d6">h₁₄</text>
  <rect x="820" y="150" width="76" height="60" rx="10" fill="#fde3d6" stroke="#eb6834"/>
  <text x="858" y="176" font-size="14" text-anchor="middle">Linear</text>
  <text x="858" y="195" font-size="11" text-anchor="middle" fill="#52514e">h·Wy + by</text>
  <line x1="896" y1="180" x2="926" y2="180" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="932" y="185" font-size="16" font-weight="600">ŷ</text>
  <text x="944" y="228" font-size="12" text-anchor="end" fill="#52514e">tomorrow's temp_min</text>

  <!-- caption -->
  <text x="24" y="334" font-size="13" fill="#0b0b0b">The four boxes are the SAME cell: one W (19×64) and one b (64) reused on all 14 days (weight sharing).</text>
  <text x="24" y="352" font-size="12" fill="#52514e">Only the last h becomes the prediction. Parameters: 1,216 + 64 + 16 + 1 = 1,297.</text>
</svg>
